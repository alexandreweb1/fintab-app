include: package:flutter_lints/flutter.yaml

analyzer:
  # custom_lint desativado no editor p/ economizar ~1.4GB de RAM (máquina 8GB).
  # Os lints do riverpod continuam disponíveis: rode `dart run custom_lint` no
  # terminal antes de commitar. Para reativar ao vivo, descomente as 2 linhas:
  # plugins:
  #   - custom_lint
  exclude:
    - "**/*.g.dart"

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - avoid_print
    - always_declare_return_types
